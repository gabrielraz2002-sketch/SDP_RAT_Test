server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolver required so nginx looks up 'backend' at request-time
        # (127.0.0.11 = Docker embedded DNS; 10.89.0.1 = Podman network DNS)
        resolver 127.0.0.11 10.89.0.1 valid=10s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
